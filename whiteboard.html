<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

:root {
    --outline-color: black;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
}

.balls {
    width: 350px;
    height: 350px;
    background: royalblue;
    border-radius: 50%;
    position: absolute;
    filter: blur(250px);
}

.ball1 {
    top: 10px;
    left: 10px;
}

.ball2 {
    bottom: 10px;
    right: 10px;
}


.whiteboard {
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.808);
    transition: 1s ease;
    z-index: 0;
}

.whiteboard.active {
    background: white;
}

.toolsContainer {
    width: 12vw;
    height: 75px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.154);
    transition: 0.75s ease;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.toolsContainer.active {
    width: 18vw;
    bottom: 40px;
}

.toolsContainer button {
    background: #21808d;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    justify-content: center;
    align-items: center;
}

.toolsContainer button.active {
    background: #f5a623;
    transform: scale(1.1);
}

.toolsContainer button:hover {
    background: #27a0b5;
    transform: scale(1.1);
}

.toolsContainer button img {
    width: 24px;
    height: 24px;
}

/* shapes */

.shapeContainer {
    position: absolute;
    top: 100px;
    left: 100px;
}

.innerShapeContainer {
    position: relative;
}

.innerShapeContainer>textarea {
    position: absolute;
    background: transparent;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: transparent;
    border: none;
    outline: none;
    cursor: grab;
    width: 200px;
    height: 200px;
}

.rectshape {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid var(--outline-color);
    cursor: grab;

}

.circleshape {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid var(--outline-color);
    border-radius: 50%;
    cursor: grab;
}

.lineshape {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid var(--outline-color);
    cursor: grab;
    background: var(--outline-color);
}

/* Hover Menu */
.hoverMenu {
    position: fixed;
    border-radius: 20px;
    width:50vw;
    background: rgba(0, 0, 0, 0.154);
    transition: 0.75s ease;
    backdrop-filter: blur(10px);
    color: black;
    padding: 12px 18px;
    font-size: 12px;
    font-family: "poppins", sans-serif;
    white-space: nowrap;
    z-index: 1000;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.menuItem {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
}

.menuItem input {
    min-width: 60px;
    max-width:110px;
    padding: 6px 8px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.1);
    color: black;
    border-radius: 6px;
    font-size: 11px;
    transition: all 0.2s ease;
}

.menuItem input:focus {
    outline: none;
    border-color: #27a0b5;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 8px rgba(39, 160, 181, 0.3);
}

.deleteBtn {
    background: #e74c3c;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.deleteBtn:hover {
    background: #c0392b;
    transform: scale(1.05);
}
    </style>
</head>

<body>
    <div class="balls ball1"></div>
    <div class="balls ball2"></div>

    <div class="toolsContainer">
        <button data-tool="circle" class="circle"><img src="./media/circle-regular-full (1).svg" alt="Circle" /></button>
        <button data-tool="square" class="rect"><img src="./media/square-regular-full.svg" alt="Square" /></button>
        <button data-tool="line" class="line"><img src="./media/grip-lines-solid-full.svg" alt="Line" /></button>
    </div>
    <div class="whiteboard">
    </div>
    <script>
        const get = (val) => { return document.querySelector(val) }
const getAll = (val) => { return document.querySelectorAll(val) }

const whiteboard = get(".whiteboard");
const toolsContainer = get(".toolsContainer");
let textarea = getAll("textarea");
const body = get("body")

// tools
const rect = get(".rect")
const circle = get(".circle")
const line = get(".line")

whiteboard.addEventListener("click", () => {
    whiteboard.classList.add("active");
    toolsContainer.classList.add("active");
    document.documentElement.style.setProperty('--outline-color', '#000');
});



// resize observer

function observeTextarea(textareaEl, shapeEl) {
    const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            const { width, height } = entry.contentRect;
            console.log('Textarea resized:', width, height);

            // Example: match shape size to textarea
            shapeEl.style.width = width - 10 + 'px';
            shapeEl.style.height = height - 10 + 'px';
        }
    });

    resizeObserver.observe(textareaEl);
}

function makeDraggable(element) {
    let offsetX = 0, offsetY = 0, mouseX = 0, mouseY = 0;

    element.onmousedown = (e) => {
        // Prevent dragging if the user is trying to type in the textarea
        if (e.target.tagName === 'TEXTAREA') return;

        e.preventDefault();
        // Get initial cursor position
        mouseX = e.clientX;
        mouseY = e.clientY;

        document.onmousemove = (e) => {
            // Calculate how far the mouse has moved
            offsetX = mouseX - e.clientX;
            offsetY = mouseY - e.clientY;
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Set the element's new position
            element.style.top = (element.offsetTop - offsetY) + "px";
            element.style.left = (element.offsetLeft - offsetX) + "px";
        };

        // Stop moving when mouse button is released
        document.onmouseup = () => {
            document.onmousemove = null;
            document.onmouseup = null;
        };
    };
}

function createHoverMenu(container, shape) {
    const menu = document.createElement("div");
    menu.classList.add("hoverMenu");
    menu.style.display = "none";

    const width = shape.offsetWidth;
    const height = shape.offsetHeight;
    const borderWidth = parseInt(window.getComputedStyle(shape).borderWidth);
    const bgColor = window.getComputedStyle(shape).backgroundColor;
    const borderColor = window.getComputedStyle(shape).borderColor;

    menu.innerHTML = `
        <div class="menuItem">
            <span>W:</span>
            <input type="number" class="widthInput" value="${width}" min="10">
        </div>
        <div class="menuItem">
            <span>H:</span>
            <input type="number" class="heightInput" value="${height}" min="10">
        </div>
        <div class="menuItem">
            <span>T:</span>
            <input type="number" class="thicknessInput" value="${borderWidth}" min="1">
        </div>
        <div class="menuItem">
            <span>B:</span>
            <input type="text" class="bgInput" value="${bgColor}" placeholder="color">
        </div>
        <div class="menuItem">
            <span>BC:</span>
            <input type="text" class="borderColorInput" value="${borderColor}" placeholder="color">
        </div>
        <button class="deleteBtn">Delete</button>
    `;

    const widthInput = menu.querySelector(".widthInput");
    const heightInput = menu.querySelector(".heightInput");
    const thicknessInput = menu.querySelector(".thicknessInput");
    const bgInput = menu.querySelector(".bgInput");
    const borderColorInput = menu.querySelector(".borderColorInput");
    const deleteBtn = menu.querySelector(".deleteBtn");

    // Update shape on input change
    widthInput.addEventListener("input", () => {
        shape.style.width = widthInput.value + "px";
    });

    heightInput.addEventListener("input", () => {
        shape.style.height = heightInput.value + "px";
    });

    thicknessInput.addEventListener("input", () => {
        shape.style.borderWidth = thicknessInput.value + "px";
    });

    bgInput.addEventListener("input", () => {
        shape.style.backgroundColor = bgInput.value;
    });

    borderColorInput.addEventListener("input", () => {
        shape.style.borderColor = borderColorInput.value;
    });

    deleteBtn.addEventListener("click", () => {
        container.remove();
        menu.remove();
    });

    body.appendChild(menu);

    let menuVisible = false;
    let hideTimeout;

    function updateMenuPosition() {
        if (menuVisible) {
            const rect = shape.getBoundingClientRect();
            menu.style.left = (rect.left + rect.width / 2 - menu.offsetWidth / 2) + "px";
            menu.style.top = (rect.top - 80) + "px";
        }
    }

    // Show menu on hover over container
    container.addEventListener("mouseenter", () => {
        clearTimeout(hideTimeout);
        menuVisible = true;
        menu.style.display = "flex";
        updateMenuPosition();
    });

    // Keep menu visible when hovering over it
    menu.addEventListener("mouseenter", () => {
        clearTimeout(hideTimeout);
        menuVisible = true;
        menu.style.display = "flex";
    });

    menu.addEventListener("mouseleave", () => {
        hideTimeout = setTimeout(() => {
            menuVisible = false;
            menu.style.display = "none";
        }, 800);
    });

    // Hide menu when leaving container (with delay)
    container.addEventListener("mouseleave", () => {
        hideTimeout = setTimeout(() => {
            menuVisible = false;
            menu.style.display = "none";
        }, 800);
    });

    // Update menu position continuously as shape moves
    const positionInterval = setInterval(() => {
        if (menuVisible) {
            updateMenuPosition();
        } else {
            clearInterval(positionInterval);
        }
    }, 50);

    return menu;
}

rect.addEventListener("click", () => {
    let container = document.createElement("div");
    container.classList.add("rectangleContainer", "shapeContainer");

    let Innercontainer = document.createElement("div");
    Innercontainer.classList.add("innerShapeContainer");

    let texta = document.createElement("textarea");
    texta.setAttribute("id", Date.now());

    let shape = document.createElement("div");
    shape.classList.add("rectshape");

    Innercontainer.appendChild(texta);
    Innercontainer.appendChild(shape);

    observeTextarea(texta, shape);

    container.appendChild(Innercontainer);
    document.body.appendChild(container);

    // --- Add Dragging Logic Here ---
    makeDraggable(container);
    createHoverMenu(container, shape);
});

circle.addEventListener("click", () => {
    let container = document.createElement("div");
    container.classList.add("circleContainer", "shapeContainer");

    let Innercontainer = document.createElement("div");
    Innercontainer.classList.add("innerShapeContainer");

    let texta = document.createElement("textarea");
    texta.setAttribute("id", Date.now());
    texta.spellcheck = false;

    let shape = document.createElement("div");
    shape.classList.add("circleshape");

    Innercontainer.appendChild(texta);
    Innercontainer.appendChild(shape);

    observeTextarea(texta, shape);

    container.appendChild(Innercontainer);
    document.body.appendChild(container);

    // --- Add Dragging Logic Here ---
    makeDraggable(container);
    createHoverMenu(container, shape);
});

line.addEventListener("click", () => {
    let container = document.createElement("div");
    container.classList.add("lineContainer", "shapeContainer");

    let Innercontainer = document.createElement("div");
    Innercontainer.classList.add("innerShapeContainer");

    let texta = document.createElement("textarea");
    texta.setAttribute("id", Date.now());
    texta.spellcheck = false;

    let shape = document.createElement("div");
    shape.classList.add("lineshape");

    Innercontainer.appendChild(texta);
    Innercontainer.appendChild(shape);

    observeTextarea(texta, shape);

    container.appendChild(Innercontainer);
    document.body.appendChild(container);

    // --- Add Dragging Logic Here ---
    makeDraggable(container);
    createHoverMenu(container, shape);
});

const TIME_LIMIT = 10; //seconds
let count = 0;
let triggered = false;

setInterval(() => {
    if (count < TIME_LIMIT) {
        count++;
        console.log(count)
        whiteboard.classList.add("active");
        toolsContainer.classList.add("active");
        document.documentElement.style.setProperty('--outline-color', '#000');
    } else if (!triggered) {
        whiteboard.classList.remove("active");
        toolsContainer.classList.remove("active");
        document.documentElement.style.setProperty('--outline-color', '#fff');
        triggered = true;
    }
}, 1000)

document.addEventListener("mousemove", () => {
    count = 0;
    triggered = false;
    whiteboard.classList.add("active");
    toolsContainer.classList.add("active");
    document.documentElement.style.setProperty('--outline-color', '#000');
})

document.addEventListener("keypress", () => {
    count = 0;
    triggered = false;
    whiteboard.classList.add("active");
    toolsContainer.classList.add("active");
    document.documentElement.style.setProperty('--outline-color', '#000');
})
    </script>
</body>

</html>
